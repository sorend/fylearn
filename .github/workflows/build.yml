
name: Build

on: [push, pull_request]

jobs:
  run-lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint and typecheck
        run: make lint

  run-tests:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14-dev"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: CODECOV_TOKEN=${{ secrets.CODECOV_TOKEN }} make test

  pack-and-publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    needs: run-tests

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          make build

      - name: Publish package to test.pypi.org
        continue-on-error: true
        if: github.event_name == 'push'
        run: |
          make publish FLIT_INDEX_URL=https://test.pypi.org/legacy/ FLIT_PASSWORD=${{ secrets.TEST_PYPI_TOKEN }}
